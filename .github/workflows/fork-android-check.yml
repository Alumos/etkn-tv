name: ETKN TV Revised Android checks

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'third_party/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/fork-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'Alumos/etkn-tv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run release unit tests and Lint without signing or packaging
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          unset ETKN_TV_SIGNING_PROPERTIES
          ./gradlew --no-daemon --console=plain :app:testReleaseUnitTest :app:lintRelease
